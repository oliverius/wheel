<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ed">
  <link rel="icon" href="media/favicon/wheel.ico" sizes="any">
  <title>Wheel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a
    class="github-link"
    href="https://github.com/oliverius/wheel"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="View the Wheel on GitHub (opens in a new tab)"
    title="View on GitHub"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        fill="currentColor"
        d="M12 .7a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.2.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11.1 11.1 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.8 5.4-5.5 5.7.4.4.8 1.1.8 2.1v3.1c0 .4.2.7.8.6A11.5 11.5 0 0 0 12 .7Z"
      >
    </svg>
  </a>

  <main class="page-shell">
    <header class="hero">
      <p class="eyebrow">A little help deciding</p>
      <h1>Let the wheel choose.</h1>
      <p class="intro">Add your names, press spin, and leave the rest to chance.</p>
    </header>

    <section class="wheel-section" aria-label="Random name wheel">
      <div class="wheel-wrap" id="wheel-wrap"></div>

      <div class="result" id="result" role="status" aria-live="polite">
        <span class="result-label">Ready when you are</span>
        <strong id="result-name">Who will it be?</strong>
        <button class="remove-winner" id="remove-winner" type="button" hidden>Remove from wheel</button>
      </div>
    </section>

    <section class="editor" aria-labelledby="editor-title">
      <div class="editor-heading">
        <div>
          <p class="eyebrow">Make it yours</p>
          <h2 id="editor-title">Edit the wheel</h2>
        </div>
        <span class="count" id="name-count">0 names</span>
      </div>

      <div class="names-list" id="names-list"></div>

      <form class="add-form" id="add-form">
        <label class="sr-only" for="new-name">Add a name</label>
        <input id="new-name" name="name" type="text" maxlength="60" placeholder="Type another name…" autocomplete="off">
        <button type="submit">Add name</button>
      </form>

      <p class="storage-note">Your list is saved automatically in this browser.</p>
    </section>
  </main>

  <script src="wheel.js"></script>
  <script src="editor.js"></script>
  <script src="app.js"></script>
</body>
</html>
